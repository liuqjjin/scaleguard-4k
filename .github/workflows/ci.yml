name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.16"

      - name: Verify uv identity
        run: test "$(uv --version | awk '{print $2}')" = "0.11.16"

      - name: Install the locked development environment
        run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"

      - name: Compile Python sources
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache-${{ matrix.python-version }}
        run: uv run --locked python -I -m compileall -q src scripts examples tests third_party/overlays

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Type check
        run: uv run --locked mypy --python-version "${{ matrix.python-version }}" src/scaleguard

      - name: CPU tests
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          SCALEGUARD_TEST_MODE: "cpu"
        run: uv run --locked python -I -m pytest --cov=scaleguard --cov-report=term-missing -q

      - name: Verify ShellCheck availability
        if: matrix.python-version == '3.12'
        run: command -v shellcheck

      - name: Check shell scripts
        if: matrix.python-version == '3.12'
        run: find scripts external_gate -type f -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Audit locked GPU dependencies
        if: matrix.python-version == '3.12'
        run: bash scripts/security/audit_runtime_locks.sh

      - name: Run isolated CPU demo
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          SCALEGUARD_TEST_MODE: "cpu"
        run: bash scripts/run_cpu_demo.sh

      - name: Build source and wheel distributions
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path

          from readme_renderer.markdown import render

          rendered = render(Path("README.md").read_text(encoding="utf-8"))
          if rendered is None:
              raise SystemExit("README.md failed strict Markdown rendering")
          PY
          uv build --no-build-isolation --out-dir "${RUNNER_TEMP}/dist"
          test -n "$(find "${RUNNER_TEMP}/dist" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          wheel="$(find "${RUNNER_TEMP}/dist" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "${wheel}"
          unzip -Z1 "${wheel}" > "${RUNNER_TEMP}/wheel-files.txt"
          grep -Eq '^scaleguard_4k-[^/]+\.dist-info/licenses/third_party/licenses/Chain-of-Zoom-MIT\.txt$' \
            "${RUNNER_TEMP}/wheel-files.txt"
          uv run --locked twine check --strict "${RUNNER_TEMP}"/dist/*

      - name: Smoke-test the installed wheel outside the repository
        if: matrix.python-version == '3.12'
        run: |
          set -Eeuo pipefail
          wheel="$(find "${RUNNER_TEMP}/dist" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          smoke_root="$(mktemp -d "${RUNNER_TEMP}/scaleguard-wheel-smoke.XXXXXXXX")"
          uv venv --python "${{ matrix.python-version }}" "${smoke_root}/venv"
          uv pip install --python "${smoke_root}/venv/bin/python" "${wheel}"

          "${smoke_root}/venv/bin/python" -I - \
            "${GITHUB_WORKSPACE}/configs/runtime/cpu-mock.yaml" \
            "${smoke_root}/config.yaml" \
            "${smoke_root}/runs" <<'PY'
          from __future__ import annotations

          import sys
          from pathlib import Path

          import yaml

          source_config, output_config, run_root = map(Path, sys.argv[1:])
          config = yaml.safe_load(source_config.read_text(encoding="utf-8"))
          config["runtime"]["run_root"] = str(run_root.resolve())
          output_config.write_text(
              yaml.safe_dump(config, sort_keys=False),
              encoding="utf-8",
          )
          PY
          "${smoke_root}/venv/bin/python" -I \
            "${GITHUB_WORKSPACE}/examples/make_fixture.py" \
            "${smoke_root}/input.png"

          cd "${smoke_root}"
          export SCALEGUARD_PROJECT_ROOT="${GITHUB_WORKSPACE}"
          "${smoke_root}/venv/bin/scaleguard" run \
            --config "${smoke_root}/config.yaml" \
            --input "${smoke_root}/input.png" \
            --output "${smoke_root}/output.png" \
            --run-id installed-wheel
          unset SCALEGUARD_PROJECT_ROOT

          "${smoke_root}/venv/bin/scaleguard" --version
          "${smoke_root}/venv/bin/scaleguard" config validate \
            "${smoke_root}/config.yaml"
          "${smoke_root}/venv/bin/scaleguard" manifest validate \
            "${smoke_root}/runs/installed-wheel/manifest.json"
          "${smoke_root}/venv/bin/scaleguard" evaluation verify --help
